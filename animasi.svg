<svg fill="none" width="400" height="100" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        .text-glow {
          font-family: sans-serif;
          font-size: 24px;
          font-weight: bold;
          color: #00ff88;
          animation: kedip 1.5s infinite alternate;
        }
        @keyframes kedip { from { opacity: 0.3; } to { opacity: 1; } }
      </style>
      <div class="text-glow">Halo, Saya Fullstack Developer!</div>
    </div>
  </foreignObject>
</svg>
